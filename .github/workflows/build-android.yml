name: Build Android release

# The signed arm64 APK, built the same way for a main push and a release tag.
# The distribution channel picks the build: `github` updates itself from the
# release feed, `fdroid` is the APK F-Droid-format repositories (IzzyOnDroid)
# take from the release (no self-update), `rustore` is the RuStore upload (no
# self-update, Mosh+ shows only the membership). All use the same signing key,
# so any installs over another.

on:
  workflow_call:
    inputs:
      distribution-channel:
        description: Store the build is made for (github, fdroid or rustore).
        type: string
        default: github
    outputs:
      artifact:
        description: Signed arm64 APK, checksum and public build configuration.
        value: ${{ jobs.apk.outputs.artifact }}
  workflow_dispatch:
    inputs:
      distribution-channel:
        description: github updates itself, fdroid is for IzzyOnDroid, rustore is the RuStore upload.
        type: choice
        options: [github, fdroid, rustore]
        default: github

permissions:
  contents: read

jobs:
  apk:
    name: Android APK (${{ inputs.distribution-channel }}, arm64, release signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No job-level CHANNEL: subosito/flutter-action reads that variable as
    # the Flutter release channel.
    env:
      # A store build carries its channel in every published name, so the
      # release keeps every APK and manifest side by side.
      SUFFIX: ${{ inputs.distribution-channel != 'github' && format('-{0}', inputs.distribution-channel) || '' }}
    outputs:
      artifact: mosh-android-release${{ env.SUFFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Require production configuration and restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          MOSH_PLUS_SERVER_URL: ${{ vars.MOSH_PLUS_SERVER_URL }}
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android release signing key}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android release signing password}"
          : "${ANDROID_SIGNING_CERT_SHA256:?Missing independent Android certificate pin}"
          : "${MOSH_PLUS_SERVER_URL:?Missing production billing origin}"
          : "${MOSH_PLUS_ISSUER_KEY:?Missing production issuer pin}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mosh-release.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path
          password = os.environ['ANDROID_KEYSTORE_PASSWORD']
          assert password.isalnum(), 'Use an alphanumeric Android keystore password'
          Path('android/key.properties').write_text(
              f"storeFile={os.environ['RUNNER_TEMP']}/mosh-release.jks\n"
              f"storePassword={password}\nkeyPassword={password}\nkeyAlias=mosh\n")
          PY

      - id: android-setup
        uses: ./.github/actions/android-build-setup
        with:
          build-mode: release

      - name: Verify AOT billing configuration
        env:
          MOSH_DISTRIBUTION_CHANNEL: ${{ inputs.distribution-channel }}
          MOSH_PLUS_NETWORK: solana-mainnet
          MOSH_PLUS_SERVER_URL: ${{ vars.MOSH_PLUS_SERVER_URL }}
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
        run: node scripts/plus-build-config.mjs "build/android-dist/plus-build$SUFFIX.json"

      - name: Build signed release APK
        shell: bash
        env:
          MOSH_DISTRIBUTION_CHANNEL: ${{ inputs.distribution-channel }}
          MOSH_PLUS_SERVER_URL: ${{ vars.MOSH_PLUS_SERVER_URL }}
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          set -euo pipefail
          version_code=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const version = readFileSync("pubspec.yaml", "utf8").match(/^version: (\d+)\.(\d+)\.(\d+)/m);
            if (!version) throw new Error("Missing semantic version");
            const [major, minor, patch] = version.slice(1).map(Number);
            const code = major * 1000000 + minor * 1000 + patch;
            if (minor > 999 || patch > 999 || code < 1 || code > 2100000000) throw new Error("Invalid Android versionCode");
            console.log(code);')
          flutter build apk --release --target-platform android-arm64 \
            --build-number="$version_code" --split-debug-info=build/android-symbols \
            "--dart-define=SENTRY_DSN=$SENTRY_DSN" \
            "--dart-define=MOSH_DISTRIBUTION_CHANNEL=$MOSH_DISTRIBUTION_CHANNEL" \
            --dart-define=MOSH_PLUS_NETWORK=solana-mainnet \
            "--dart-define=MOSH_PLUS_SERVER_URL=$MOSH_PLUS_SERVER_URL" \
            "--dart-define=MOSH_PLUS_ISSUER_KEY=$MOSH_PLUS_ISSUER_KEY"

      # Preserve expensive native compilation even if package validation fails.
      - uses: actions/cache/save@v4
        if: steps.android-setup.outputs.cargo-cache-hit != 'true'
        with:
          path: build/mosh_core/build
          key: ${{ steps.android-setup.outputs.cargo-cache-key }}

      - name: Prove release signing refuses missing credentials
        shell: bash
        run: |
          set -euo pipefail
          mv android/key.properties "$RUNNER_TEMP/mosh-key.properties"
          trap 'mv "$RUNNER_TEMP/mosh-key.properties" android/key.properties' EXIT
          if bash android/gradlew -p android :app:preReleaseBuild --console=plain > "$RUNNER_TEMP/mosh-missing-signing.log" 2>&1; then
            echo '::error::Release preparation accepted missing signing credentials'
            exit 1
          fi
          grep -Fq 'Android release signing requires a complete android/key.properties' "$RUNNER_TEMP/mosh-missing-signing.log"

      - name: Verify signature, manifest, native libraries and alignment
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/android-package-verify.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          apk="mosh-$version$SUFFIX-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/android-dist/$apk"
          cd build/android-dist
          sha256sum "$apk" > "$apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mosh-android-release${{ env.SUFFIX }}
          path: build/android-dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mosh-android-symbols${{ env.SUFFIX }}
          path: |
            build/android-symbols/
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Remove runner signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/mosh-release.jks"
