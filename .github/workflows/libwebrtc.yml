name: libwebrtc builds

# Our libwebrtc for the call engine (mosh-media/webrtc): LiveKit's webrtc-sdk
# fork at the commit pinned in third_party/libwebrtc-build/build.json, built
# by LiveKit's scripts with our patches (no H.264). Archives are published
# as assets of the pinned release, which desktop builds download and check
# against the SHA-256 recorded beside it. The Android archive also goes to
# Maven Central, where F-Droid accepts it from and Gradle fetches it. A
# published archive is never replaced: a change to the build bumps the
# release's name. A target added later is built alone and joins the release.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/libwebrtc.yml'
      - 'third_party/libwebrtc-build/build.json'
      - 'third_party/webrtc-sys-patches/**'
      - 'scripts/libwebrtc-build.mjs'
      - 'scripts/libwebrtc-maven.mjs'
      - 'scripts/support/libwebrtc-targets.mjs'
      - 'scripts/support/libwebrtc-headers.mjs'

concurrency:
  group: libwebrtc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pending:
    name: Find unpublished archives
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      exists: ${{ steps.release.outputs.exists }}
      targets: ${{ steps.release.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(jq -r .release third_party/libwebrtc-build/build.json)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          # Only a 404 means missing; any other failure must not start a rebuild.
          if found=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release" --jq '[.assets[].name]' 2>&1); then
            exists=true
          elif grep -q 'HTTP 404' <<< "$found"; then
            exists=false
            found='[]'
          else
            echo "$found" >&2
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          # The targets whose archive the release lacks, with their runner.
          ASSETS="$found" node --input-type=module -e '
            import { libwebrtcTarget, libwebrtcTriples } from "./scripts/support/libwebrtc-targets.mjs";
            const runner = { linux: "ubuntu-latest", android: "ubuntu-latest", windows: "windows-2022",
              macos: "macos-latest", ios: "macos-latest" };
            const assets = JSON.parse(process.env.ASSETS);
            const missing = libwebrtcTriples
              .map((triple) => ({ triple, ...libwebrtcTarget(triple) }))
              .filter(({ archive }) => !assets.includes(archive))
              .map(({ triple, script }) => ({ target: triple, os: runner[script] }));
            console.log(`targets=${JSON.stringify(missing)}`);
          ' | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: pending
    if: needs.pending.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: ${{ !contains(matrix.target, 'android') }}
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          pip3 install setuptools
          sudo apt-get update -y
          sudo apt-get install -y ninja-build pkg-config openjdk-17-jdk
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip3 install setuptools
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath "$Env:RUNNER_TEMP\ninja"
          "$Env:RUNNER_TEMP\ninja" | Out-File -Append -Encoding utf8 -FilePath $Env:GITHUB_PATH
      - name: Build libwebrtc
        # Windows: a short work path keeps Chromium's deep tree under MAX_PATH.
        shell: bash
        run: |
          work="${{ runner.os == 'Windows' && 'C:/w' || format('{0}/libwebrtc-work', runner.temp) }}"
          node scripts/libwebrtc-build.mjs --target ${{ matrix.target }} --work "$work" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: libwebrtc-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.pending.outputs.release }}
    needs: [pending, build]
    # Pushes and dispatches in this repository; never a fork's code.
    if: github.repository == 'redstone-md/mosh-flutter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libwebrtc-*
          merge-multiple: true
          path: dist
      - name: Create or extend the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.pending.outputs.release }}
          EXISTS: ${{ needs.pending.outputs.exists }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          if [ "$EXISTS" = true ]; then
            # Archives already published stay as they are; SHA256SUMS lists all.
            gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output published.sums
            sort -k2 -u published.sums SHA256SUMS -o SHA256SUMS
            cat SHA256SUMS
            gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" *.tar.gz
            gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" SHA256SUMS --clobber
            exit 0
          fi
          cat SHA256SUMS
          # A pre-release that is never "latest": the app's update check skips
          # tags that are not versions, and this must not displace a Mosh build.
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "$RELEASE" \
            --notes "libwebrtc for the call engine, built by .github/workflows/libwebrtc.yml (no H.264). Pin the SHA256SUMS in third_party/libwebrtc-build/build.json." \
            *.tar.gz SHA256SUMS

  maven:
    name: Publish the Android build to Maven Central
    needs: [pending, publish]
    # Maven Central keeps a version forever, so only main or a deliberate run
    # publishes, and only an Android archive that existed before this run: a
    # new one is published before build.json pins its SHA-256, and a run by
    # hand on the branch of the commit that pins it publishes it before the
    # merge (third_party/libwebrtc-build/README.md).
    if: >-
      ${{ !cancelled() && !failure() && github.repository == 'redstone-md/mosh-flutter'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      && !contains(needs.pending.outputs.targets, 'aarch64-linux-android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the Android archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.pending.outputs.release }}
        run: gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern libwebrtc-android-arm64-release.tar.gz --dir "$RUNNER_TEMP"
      - name: Import the signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          : "${MAVEN_GPG_PRIVATE_KEY:?Missing the Maven Central signing key}"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: node scripts/libwebrtc-maven.mjs --archive "$RUNNER_TEMP/libwebrtc-android-arm64-release.tar.gz"
