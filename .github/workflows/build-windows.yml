name: Build Windows installer

# The one shippable Windows artifact, built the same way for a main push
# (proof it still packages) and for a release tag (what gets published).
# Reusable so the two callers cannot drift.
#
# The installer is UNSIGNED -- SmartScreen will warn. The SignPath
# application was declined; see CODE_SIGNING.md for the policy.

on:
  workflow_call:
    inputs:
      upload-debug-files:
        description: Upload native debug files to Sentry (release tags only).
        type: boolean
        default: false
      parallel-codegen:
        description: Compile mosh-core with parallel codegen (CI proof builds, never releases).
        type: boolean
        default: false
      plus-network:
        description: PLUS network (solana-mainnet or solana-devnet).
        type: string
        default: solana-mainnet
      plus-server-url:
        description: Optional PLUS billing URL (HTTPS or loopback HTTP).
        type: string
        default: ''
      plus-issuer-key:
        description: Optional independently pinned PLUS issuer public SPKI base64.
        type: string
        default: ''
    outputs:
      artifact:
        description: Name of the uploaded artifact holding the setup .exe and its .sha256.
        value: ${{ jobs.installer.outputs.artifact }}
  workflow_dispatch:
    inputs:
      plus-network:
        description: PLUS network (solana-mainnet or solana-devnet).
        type: string
        default: solana-mainnet
      plus-server-url:
        description: PLUS billing URL (HTTPS or loopback HTTP).
        type: string
        default: ''
      plus-issuer-key:
        description: Independently pinned PLUS issuer public SPKI base64.
        type: string
        default: ''
      parallel-codegen:
        description: Compile mosh-core with parallel codegen for a proof build.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer (release, unsigned)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ inputs.plus-issuer-key != '' && inputs.plus-network == 'solana-devnet' && 'mosh-windows-plus-devnet' || 'mosh-windows-setup' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: windows

      # cargokit compiles mosh-core into its own target dir under the
      # plugin's CMake binary dir (named after the plugin, mosh_core), which
      # the cargo cache above does not see. Keyed on the lockfile and
      # toolchain; a stale hit is safe, cargo re-fingerprints.
      - uses: actions/cache@v4
        with:
          path: build/windows/x64/plugins/mosh_core/cargokit_build
          key: cargokit-windows-release-${{ hashFiles('mosh-core/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargokit-windows-release-

      - uses: ./.github/actions/media-kit-windows

      # CI builds only prove the app still packages; release.yml builds the
      # shipped artifact with the profile as committed. Fat LTO stays here
      # too (changing lto rebuilds every dependency), but mosh-core's own
      # codegen runs in parallel: its rebuild drops from ~4 to ~1.5 minutes
      # with the dependency cache intact.
      - name: Parallel mosh-core codegen (CI proof builds)
        if: inputs.parallel-codegen
        shell: bash
        run: |
          config="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$config")"
          printf '\n[profile.release.package.mosh-core]\ncodegen-units = 16\n' >> "$config"

      - name: Validate PLUS configuration and record public manifest
        env:
          MOSH_PLUS_NETWORK: ${{ inputs.plus-network }}
          MOSH_PLUS_SERVER_URL: ${{ inputs.plus-server-url }}
          MOSH_PLUS_ISSUER_KEY: ${{ inputs.plus-issuer-key }}
        run: node scripts/plus-build-config.mjs build/plus-build.json

      - name: Build Windows app (release)
        env:
          MOSH_PLUS_NETWORK: ${{ inputs.plus-network }}
          MOSH_PLUS_SERVER_URL: ${{ inputs.plus-server-url }}
          MOSH_PLUS_ISSUER_KEY: ${{ inputs.plus-issuer-key }}
        # ADR 0035: the Sentry DSN (a public repo variable) enables opt-in
        # crash reporting; without it the build cannot report at all.
        run: >-
          flutter build windows --release --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }}
          "--dart-define=MOSH_PLUS_NETWORK=$env:MOSH_PLUS_NETWORK"
          "--dart-define=MOSH_PLUS_SERVER_URL=$env:MOSH_PLUS_SERVER_URL"
          "--dart-define=MOSH_PLUS_ISSUER_KEY=$env:MOSH_PLUS_ISSUER_KEY"

      - name: Test native Windows chrome, icons and call window classes
        shell: pwsh
        run: |
          cmake --build build/windows/x64 --config Release --target mosh_window_icon_test mosh_desktop_title_bar_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\windows\x64\runner\tests\Release\mosh_desktop_title_bar_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\windows\x64\runner\tests\Release\mosh_window_icon_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOSH_CALL_WINDOW = '1'
          try {
            & .\build\windows\x64\runner\tests\Release\mosh_window_icon_test.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item Env:MOSH_CALL_WINDOW
          }

      # ADR 0035: upload the separate debug files (Rust PDB/dSYM, runner)
      # so Sentry symbolicates native crashes and Rust panics. Release tags
      # only; a fork without the token skips it.
      # Installed in its own step so npm's download and install scripts never
      # see the token; only the pinned sentry-cli binary runs with it.
      - name: Install sentry-cli
        if: inputs.upload-debug-files
        run: npm install --global @sentry/cli@3.8.0

      - name: Upload debug files to Sentry
        if: inputs.upload-debug-files
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: redstone-aq
          SENTRY_PROJECT: flutter
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN; skipping."; exit 0; fi
          # --no-zips: plugin CMake (NuGet packages, WinSparkle) leaves archives
          # in build/windows/x64; sentry-cli fails on them with "Invalid
          # checksum", and no debug file we ship lives inside one.
          sentry-cli debug-files upload --no-zips build/windows/x64

      # The runner image does not guarantee Inno Setup; chocolatey is there.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # AppVersion comes from pubspec so the installer filename, the
      # Add/Remove Programs entry and the app cannot disagree on the version.
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          Write-Host "Packaging Mosh $version"
          iscc /Q /DAppVersion=$version windows\installer\mosh.iss

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem build\installer\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
            Write-Host "$hash  $($_.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.plus-issuer-key != '' && inputs.plus-network == 'solana-devnet' && 'mosh-windows-plus-devnet' || 'mosh-windows-setup' }}
          path: |
            build/installer/*.exe
            build/installer/*.sha256
            build/plus-build.json
          if-no-files-found: error
