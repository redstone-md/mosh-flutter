name: Windows readiness integration comparison

on:
  push:
    branches: [test/windows-idle-current]
    paths: [.github/workflows/idle-readiness-comparison.yml]
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Completed configured Windows installer run
        type: string
        required: true
      candidate-installer-sha:
        description: Verified candidate installer SHA-256
        type: string
        required: true
      candidate-source:
        description: Immutable candidate Mosh commit
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  comparison:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      CANDIDATE_RUN: ${{ inputs.candidate-run || '40152604248' }}
      CANDIDATE_INSTALLER_SHA: ${{ inputs.candidate-installer-sha || '0aa8593c0ccd0793d2e22b28bcd9d6d0ab5c10e256d7ebad6f759776d96fffff' }}
      CANDIDATE_SOURCE: ${{ inputs.candidate-source || 'b81f5f1367239709911c602ba399c9e061404fd4' }}
    strategy:
      fail-fast: false
      matrix:
        order: [before-after, after-before]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          moss: none
      - name: Compile the existing measurement client before profiling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s scripts/perf -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Measurement tests failed' }
          dart compile exe scripts/perf/idle_api.dart -o scripts/perf/idle-api.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bridge client compilation failed' }
          Add-Type -Path scripts/perf/ProfileAccessibility.cs -ReferencedAssemblies Accessibility
      - uses: ./.github/actions/install-profile-app
        with:
          run-id: ${{ env.CANDIDATE_RUN }}
          installer-sha: ${{ env.CANDIDATE_INSTALLER_SHA }}
          runtime-commit: ${{ env.CANDIDATE_SOURCE }}
      - name: Exercise the actual candidate package and seed its saved chats
        shell: powershell
        env:
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
        run: |
          python scripts/perf/windows_idle.py "$env:IDLE_APP" build/comparison/candidate-smoke 100 --smoke-ci-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Actual candidate package smoke failed' }
      - name: Preserve the verified candidate DLL
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR_ORDER: ${{ matrix.order }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SOURCE -notmatch '^[a-f0-9]{40}$') { throw 'Expected an immutable source' }
          $tree = gh api "repos/redstone-md/mosh-flutter/git/trees/$env:CANDIDATE_SOURCE" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Source tree lookup failed' }
          $pin = ($tree.tree | Where-Object path -eq 'moss').sha
          if ($pin -ne 'fcdc3383601cf3fb5232ba1ae1ffe262b552555e') { throw 'Unexpected candidate Moss pin' }
          New-Item -ItemType Directory -Force build/comparison | Out-Null
          Copy-Item "$env:IDLE_APP/moss.dll" build/candidate-moss.dll
          @{ order = $env:PAIR_ORDER; candidate_source = $env:CANDIDATE_SOURCE; candidate_run = $env:CANDIDATE_RUN
             candidate_installer_sha256 = $env:CANDIDATE_INSTALLER_SHA; candidate_moss_source = $pin
             baseline_moss_source = '979a63459e7327aec5a318b108d0382a8f5b091c'
             candidate_moss_sha256 = (Get-FileHash build/candidate-moss.dll -Algorithm SHA256).Hash.ToLowerInvariant()
             measurement_source = $env:GITHUB_SHA; image = $env:ImageVersion
             client_sha256 = (Get-FileHash scripts/perf/idle-api.exe -Algorithm SHA256).Hash.ToLowerInvariant()
             os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
             hardware = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors)
          } | ConvertTo-Json -Depth 5 | Set-Content build/comparison/provenance.json
          Remove-Item build/source, build/native-symbols -Recurse -Force
      - uses: ./.github/actions/install-profile-app
        with:
          run-id: '40133081747'
          installer-sha: 96579efd8773718af731647a0d797b3bfff7cf3d99d4317bf066a1cbbcae37dc
          runtime-commit: aa17f31ef0e5e75fa81b02fe72e9d82f9a1a6d5a
      - name: Prepare identical application copies before either observation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $after = Join-Path $env:RUNNER_TEMP 'mosh-idle-after'
          Copy-Item $env:IDLE_APP $after -Recurse
          Copy-Item build/candidate-moss.dll "$after/moss.dll" -Force
          "IDLE_AFTER=$after" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Measure both variants with one saved fixture
        shell: powershell
        env:
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
          PAIR_ORDER: ${{ matrix.order }}
        run: |
          $ErrorActionPreference = 'Stop'
          $variants = $env:PAIR_ORDER.Split('-')
          for ($index = 0; $index -lt $variants.Count; $index++) {
            $variant = $variants[$index]
            $app = if ($variant -eq 'before') { $env:IDLE_APP } else { $env:IDLE_AFTER }
            $profileArgs = @('scripts/perf/windows_idle.py', $app, "build/comparison/$variant", '100', '--reuse-ci-fixture')
            python @profileArgs
            if ($LASTEXITCODE -ne 0) { throw "GUI profile failed for $variant" }
          }
          python scripts/perf/compare_idle_profiles.py build/comparison
          if ($LASTEXITCODE -ne 0) { throw 'Fixture/binary comparison failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-readiness-${{ matrix.order }}
          path: |
            build/comparison/*.json
            build/comparison/before/*.json
            build/comparison/after/*.json
            build/comparison/candidate-smoke/*.json
          if-no-files-found: error
          retention-days: 7
