name: Build macOS DMG

# The one shippable macOS artifact, built the same way for a main push
# (proof it still packages) and for a release tag (what gets published).
# Reusable so the two callers cannot drift. workflow_dispatch lets a
# maintainer build a DMG for the already-published release without
# re-tagging (the v0.9.0 retro-attach ran this way).
#
# With the APPLE_DEVELOPER_ID_P12_* secrets the app and the DMG carry the
# Developer ID signature with the hardened runtime; with `notarize` the DMG
# is also notarized with the APP_STORE_CONNECT_* key and stapled, or the job
# fails, so Gatekeeper opens it without a warning (CODE_SIGNING.md).
# Releases notarize; proof builds on main only sign. Pull requests and forks
# get no certificate and stay ad-hoc. Callers pass `secrets: inherit`.

on:
  workflow_call:
    inputs:
      upload-debug-files:
        description: Upload native debug files to Sentry (release tags only).
        type: boolean
        default: false
      universal:
        description: Build universal binary (arm64 + x86_64). When false, builds host arch (arm64 on Apple Silicon) for fast CI checks.
        type: boolean
        default: true
      parallel-codegen:
        description: Compile mosh-core with parallel codegen (CI proof builds, never releases).
        type: boolean
        default: false
      notarize:
        description: Notarize and staple the DMG (releases).
        type: boolean
        default: false
      distribution-channel:
        description: Store the build is made for (github, msstore, ...); empty is github.
        type: string
        default: github
      plus-network:
        description: PLUS network (solana-mainnet or solana-devnet).
        type: string
        default: solana-mainnet
      plus-server-url:
        description: Optional PLUS billing URL (HTTPS or loopback HTTP).
        type: string
        default: ''
      plus-issuer-key:
        description: Optional independently pinned PLUS issuer public SPKI base64.
        type: string
        default: ''
    outputs:
      artifact:
        description: Name of the uploaded artifact holding the universal .dmg and its .sha256.
        value: ${{ jobs.dmg.outputs.artifact }}
  workflow_dispatch:
    inputs:
      universal:
        description: Build universal binary (arm64 + x86_64).
        type: boolean
        default: true
      plus-network:
        description: PLUS network (solana-mainnet or solana-devnet).
        type: string
        default: solana-mainnet
      plus-server-url:
        description: PLUS billing URL (HTTPS or loopback HTTP).
        type: string
        default: ''
      plus-issuer-key:
        description: Independently pinned PLUS issuer public SPKI base64.
        type: string
        default: ''
      parallel-codegen:
        description: Compile mosh-core with parallel codegen for a proof build.
        type: boolean
        default: true
      notarize:
        description: Notarize and staple the DMG.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dmg:
    name: macOS DMG (release, ${{ inputs.universal && 'universal' || 'arm64' }}${{ inputs.notarize && ', notarized' || '' }})
    runs-on: macos-latest
    # Notarization can wait up to an hour on Apple (scripts/macos-notarize.sh).
    timeout-minutes: ${{ inputs.notarize && 120 || 60 }}
    outputs:
      artifact: ${{ inputs.plus-issuer-key != '' && inputs.plus-network == 'solana-devnet' && 'mosh-macos-plus-devnet' || 'mosh-macos-dmg' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: macos

      # Reuse the call engine's release slices.
      # `simd` in the key: cargo keeps a mozjpeg built without nasm, so the
      # caches saved before nasm was installed must not seed this one.
      - id: native-app
        uses: actions/cache/restore@v4
        with:
          path: |
            .dart_tool/native-media/target
            .dart_tool/native-sources
            .dart_tool/native-tools
          key: native-app-simd-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mosh-media/**/Cargo.lock', 'third_party/*-patches/source.json', 'third_party/*-patches/mosh.patch') }}
          restore-keys: native-app-simd-${{ runner.os }}-${{ runner.arch }}-

      # cargokit compiles mosh-core into the pod target's Xcode temp dir
      # (TARGET_TEMP_DIR, .../Pods.build/<config>/mosh_core.build), which the
      # cargo cache above does not see. Keyed on the lockfile and toolchain;
      # a stale hit is safe, cargo re-fingerprints.
      - id: cargokit
        uses: actions/cache/restore@v4
        with:
          path: build/macos/**/mosh_core.build
          key: cargokit-macos-release-${{ hashFiles('mosh-core/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargokit-macos-release-

      # Universal release build: cargokit builds one slice per ARCHS
      # entry (arm64 + x86_64) and lipos them, so the x86_64 target must
      # be installed first. Fast single-arch builds (PRs) skip it.
      - if: inputs.universal
        name: Add Rust macos target
        run: rustup target add x86_64-apple-darwin

      # The x86_64 slice of the camera helper assembles its JPEG decoder's
      # SIMD with nasm.
      - if: inputs.universal
        run: brew install nasm

      # CI builds only prove the app still packages; release.yml builds the
      # shipped artifact with the profile as committed. Fat LTO stays here
      # too (changing lto rebuilds every dependency), but mosh-core's own
      # codegen runs in parallel: its rebuild drops from ~4 to ~1.5 minutes
      # with the dependency cache intact.
      - name: Parallel mosh-core codegen (CI proof builds)
        if: inputs.parallel-codegen
        shell: bash
        run: |
          config="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          mkdir -p "$(dirname "$config")"
          printf '\n[profile.release.package.mosh-core]\ncodegen-units = 16\n' >> "$config"

      - name: Validate PLUS configuration and record public manifest
        env:
          MOSH_DISTRIBUTION_CHANNEL: ${{ inputs.distribution-channel }}
          MOSH_PLUS_NETWORK: ${{ inputs.plus-network }}
          MOSH_PLUS_SERVER_URL: ${{ inputs.plus-server-url }}
          MOSH_PLUS_ISSUER_KEY: ${{ inputs.plus-issuer-key }}
        run: node scripts/plus-build-config.mjs build/plus-build.json

      - name: Build macOS app (release)
        env:
          # Flutter hands FLUTTER_XCODE_* to xcodebuild as build settings, so
          # this reaches every target: the app, the pods and their scripts
          # that build mosh-core and the call engine one slice per ARCHS.
          # A release build has no active architecture (its destination is
          # generic), so ONLY_ACTIVE_ARCH changes nothing there.
          FLUTTER_XCODE_EXCLUDED_ARCHS: ${{ !inputs.universal && 'x86_64' || '' }}
          MOSH_DISTRIBUTION_CHANNEL: ${{ inputs.distribution-channel }}
          MOSH_PLUS_NETWORK: ${{ inputs.plus-network }}
          MOSH_PLUS_SERVER_URL: ${{ inputs.plus-server-url }}
          MOSH_PLUS_ISSUER_KEY: ${{ inputs.plus-issuer-key }}
        # ADR 0035: the Sentry DSN (a public repo variable) enables opt-in
        # crash reporting; without it the build cannot report at all.
        run: >-
          flutter build macos --release --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }}
          "--dart-define=MOSH_DISTRIBUTION_CHANNEL=$MOSH_DISTRIBUTION_CHANNEL"
          "--dart-define=MOSH_PLUS_NETWORK=$MOSH_PLUS_NETWORK"
          "--dart-define=MOSH_PLUS_SERVER_URL=$MOSH_PLUS_SERVER_URL"
          "--dart-define=MOSH_PLUS_ISSUER_KEY=$MOSH_PLUS_ISSUER_KEY"

      - if: steps.native-app.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            .dart_tool/native-media/target
            .dart_tool/native-sources
            .dart_tool/native-tools
          key: ${{ steps.native-app.outputs.cache-primary-key }}

      - if: steps.cargokit.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: build/macos/**/mosh_core.build
          key: ${{ steps.cargokit.outputs.cache-primary-key }}

      # ADR 0035: upload the separate debug files (Rust PDB/dSYM, runner)
      # so Sentry symbolicates native crashes and Rust panics. Release tags
      # only; a fork without the token skips it.
      # Installed in its own step so npm's download and install scripts never
      # see the token; only the pinned sentry-cli binary runs with it.
      - name: Install sentry-cli
        if: inputs.upload-debug-files
        run: npm install --global @sentry/cli@3.8.0

      - name: Upload debug files to Sentry
        if: inputs.upload-debug-files
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: redstone-aq
          SENTRY_PROJECT: flutter
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN; skipping."; exit 0; fi
          sentry-cli debug-files upload build/macos

      # create-dmg lays out the installer window (icon positions,
      # Applications symlink, background) via AppleScript; the formula is
      # small and installs in seconds.
      - name: Install create-dmg
        run: brew install create-dmg

      # Not for pull requests: a PR branch can change the scripts that would
      # see the certificate, so PR proof builds stay ad-hoc signed.
      - name: Import the Developer ID signing identity
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEVELOPER_ID_P12_BASE64 || '' }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || '' }}
        run: bash scripts/macos-import-signing.sh

      # With `notarize` the DMG is notarized or the job fails.
      - name: Package DMG + notarization + checksum
        env:
          MOSH_MACOS_UNIVERSAL: ${{ inputs.universal && 'true' || 'false' }}
          MOSH_NOTARIZE: ${{ inputs.notarize && 'true' || 'false' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.notarize && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          APP_STORE_CONNECT_KEY_ID: ${{ inputs.notarize && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ inputs.notarize && secrets.APP_STORE_CONNECT_KEY_P8_BASE64 || '' }}
        run: bash scripts/macos-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.plus-issuer-key != '' && inputs.plus-network == 'solana-devnet' && 'mosh-macos-plus-devnet' || 'mosh-macos-dmg' }}
          path: |
            build/macos-dist/*.dmg
            build/macos-dist/*.sha256
            build/plus-build.json
          if-no-files-found: error
