name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI matrix (ADR 0015). The desktop jobs run on windows-latest: the
# integration test needs mosh_core.dll (Windows-built via cargokit), and the
# cargo jobs dlopen moss.dll. flutter-test needs no Rust runtime and no
# Windows-only behaviour, so it runs on the faster ubuntu-latest, as does
# android-build, whose image ships the Android SDK + NDK. The macOS lanes (rust-core-macos, macos-dmg) run
# on macos-latest (arm64): the darwin compile and the universal DMG can only
# be proven there.
#
# Toolchains, caches and the moss library come from .github/actions/setup so
# every job pins the same versions. The moss build and the cargo target dirs
# are cached; a job pays for them only when the submodule or lockfile moves.
#
# Job order: every job starts at once. The repo is public, so runner minutes
# are free and wall-clock is the only cost; gating the platform builds behind
# the cheap checks put ~15 min of dead time on the critical path. The tagged
# release still gates through release.yml's verify. Native device-link checks
# build the Rust library and peer executable for flutter_tester without
# building the desktop app.
jobs:
  native-call-media:
    name: Native call media (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          flutter: 'false'
          rust-cache-key: native-call
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            .dart_tool/native-media/target
            .dart_tool/native-sources
            .dart_tool/native-tools
          key: native-call-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mosh-media/**/Cargo.lock', 'third_party/*-patches/source.json', 'third_party/*-patches/mosh.patch') }}
          restore-keys: native-call-${{ runner.os }}-${{ runner.arch }}-
      - name: Build packaged engine and camera helper
        run: node scripts/native-media-build.mjs
      - name: Native Rust format, lint and tests
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$PWD/.dart_tool/native-media/target"
          export PROTOC="$(node --input-type=module -e 'import {nativeProtoc} from "./scripts/support/native-protoc.mjs"; console.log(await nativeProtoc(process.cwd()))')"
          for crate in engine capture; do
            cargo fmt --manifest-path "mosh-media/$crate/Cargo.toml" --check
            cargo clippy --manifest-path "mosh-media/$crate/Cargo.toml" --all-targets -- -D warnings
            cargo test --manifest-path "mosh-media/$crate/Cargo.toml"
          done
      - name: Build independent API peer and capture driver
        run: cargo build --manifest-path mosh-core/Cargo.toml --features native-media-tests --lib --bin mosh-camera-test-driver --test device_link_flow
      - name: Real MLS, Moss and native SRTP calls
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) engine=mosh_native_media.dll; helper=mosh-camera-test-driver.exe ;;
            macOS) engine=libmosh_native_media.dylib; helper=mosh-camera-test-driver ;;
            Linux) engine=libmosh_native_media.so; helper=mosh-camera-test-driver ;;
          esac
          export MOSH_MEDIA_ENGINE="$PWD/.dart_tool/native-media/debug/$engine"
          export MOSH_CAMERA_CAPTURE="$PWD/mosh-core/target/debug/$helper"
          node scripts/moss-test.mjs --test device_link_flow native_ -- --ignored --nocapture

  rust-core:
    name: Rust core (fmt + clippy + test)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          flutter: 'false'
          rust-cache-key: desktop

      - name: Rustfmt check
        run: cargo fmt --manifest-path mosh-core/Cargo.toml --check

      - name: Pinned source preparation tests
        run: node --test scripts/openmls-prepare.test.mjs scripts/ringrtc-prepare.test.mjs scripts/source-lock.test.mjs

      # Strict lint gate (ADR 0015): warnings fail the job.
      - name: Clippy check
        run: cargo clippy --manifest-path mosh-core/Cargo.toml --all-targets -- -D warnings

      # Real Moss + automatic discovery use a local tracker, independent of
      # public tracker availability or unrelated public peers. Every test
      # target but the multi-device DM flow, which runs in its own job.
      - name: Cargo test
        shell: bash
        run: |
          targets=()
          for file in mosh-core/tests/*.rs; do
            name=$(basename "$file" .rs)
            [ "$name" = multi_device_dm_flow ] || targets+=(--test "$name")
          done
          node scripts/moss-test.mjs --lib "${targets[@]}"

  # The multi-device DM flow is ~11 minutes of real-Moss installations
  # waiting on protocol timeouts, not CPU, so it gets its own runner beside
  # rust-core instead of after it. It shares rust-core's test-profile cache.
  rust-core-dm-flow:
    name: Rust core multi-device DM flow (real Moss)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          flutter: 'false'
          rust-cache-key: desktop

      - name: Cargo test (multi-device DM flow)
        run: node scripts/moss-test.mjs --test multi_device_dm_flow

  codegen-drift:
    name: flutter_rust_bridge codegen drift
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Its own cache: it builds no test profile, and as the first desktop
      # job to finish it used to save the shared key, leaving the test jobs
      # to rebuild every dependency.
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: desktop-codegen

      # A cargo install from source is minutes of compile for a binary that
      # only changes when the pinned version does; cache the built binaries.
      # cargo-expand is what the codegen shells out to; without it installed
      # the codegen installs it itself, from source, on every run.
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@2.12.0
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-expand@1.0.126

      # The same generate AGENTS.md documents, so the committed bindings stay
      # byte-identical to a fresh regen: dart fix + dart format run here
      # exactly as they do locally.
      - name: Regenerate bindings
        run: flutter_rust_bridge_codegen generate --no-deps-check --no-build-runner --no-rust-format

      # Format the regenerated Rust binding with the crate's own `cargo fmt`
      # so the drift check compares like with like against the committed,
      # cargo-fmt-formatted `frb_generated.rs`. Dart bindings are formatted
      # by the generate step itself.
      - name: Format regenerated Rust binding
        run: cargo fmt --manifest-path mosh-core/Cargo.toml -- mosh-core/src/frb_generated.rs

      # A non-empty diff means the committed bindings drifted from the Rust
      # signatures. Drift fails the gate.
      - name: Check for binding drift
        run: git diff --exit-code lib/src/rust mosh-core/src/frb_generated.rs

  flutter-test:
    name: Flutter gen-l10n + widget and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          moss: none

      # flutter test runs native-asset hooks: super_native_extensions builds
      # its Rust (gtk-rs on Linux) through the runner's rustup.
      - name: GTK headers for native-asset hooks
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev

      # The hook's Rust build output, keyed on the resolved packages.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-hooks-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: native-hooks-linux-

      # The generated lib/l10n/app_localizations*.dart are gitignored, so
      # the drift signal is gen-l10n exiting 0: a broken ARB fails here,
      # before the tests that would fail on it less legibly.
      - name: flutter gen-l10n
        run: flutter gen-l10n

      # Widget tests override gatewayProvider with the scriptable gateway in
      # test/support/, so no Rust runtime is needed here (ADR 0013).
      - name: flutter test
        run: flutter test

  integration-test:
    name: Integration test (real bridge, slice one)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: windows

      - uses: actions/cache/restore@v4
        id: cargokit-cache
        with:
          path: build/windows/x64/plugins/mosh_core/cargokit_build
          key: cargokit-windows-debug-${{ hashFiles('mosh-core/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargokit-windows-debug-

      - uses: ./.github/actions/media-kit-windows

      # Debug on purpose: `flutter test -d windows` needs the VM service,
      # which a release build strips. Builds mosh.exe and deploys
      # mosh_core.dll so the test runs against the real Rust backend.
      - name: Build Windows app (debug)
        run: flutter build windows --debug

      - name: Save Windows debug build cache
        if: steps.cargokit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/windows/x64/plugins/mosh_core/cargokit_build
          key: ${{ steps.cargokit-cache.outputs.cache-primary-key }}

      - name: Integration test (slice one)
        run: flutter test integration_test/slice_one_test.dart -d windows

  native-device-linking:
    name: Native device linking (real bridge and peers)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: desktop

      # The lib is what flutter_tester loads; the device_link_flow test binary
      # is the peer NativePeer spawns from target/debug/deps. rust-core runs
      # the tests themselves, so only build them here.
      - name: Build device-link native test library and peer
        run: cargo build --manifest-path mosh-core/Cargo.toml --lib --test device_link_flow

      - name: Native peer pipe regression
        run: flutter test native_test/native_peer_io_test.dart

      - name: Device linking through the native Flutter UI
        env:
          MOSH_DEBUG_RECORD_DIR: ${{ runner.temp }}/mosh-native-link-debug
        run: |
          New-Item -ItemType Directory -Force -Path "$env:MOSH_DEBUG_RECORD_DIR" | Out-Null
          node scripts/moss-test.mjs --native-ui

      - name: Upload native Moss diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-link-diagnostics
          path: ${{ runner.temp }}/mosh-native-link-debug/*.mossrec
          if-no-files-found: ignore
          retention-days: 1

      # The process-global Rust store closes when flutter_tester exits.
      - name: Clean native device-link test stores
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path ([System.IO.Path]::GetTempPath()) -Directory -Filter 'mosh-native-link-*' |
            Remove-Item -Recurse -Force

  android-build:
    name: Android APK (arm64, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Gradle needs a JDK; Flutter's Android toolchain expects 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: ./.github/actions/setup
        with:
          moss: android
          rust-cache-key: android

      # Cargokit builds libmosh_core.so for the device ABI; the target has to
      # exist before Gradle invokes it. build.gradle.kts pins arm64-v8a.
      - name: Add Rust android target
        run: rustup target add aarch64-linux-android

      # audiopus_sys links a prebuilt arm64 libopus.a from
      # third_party/opus-android-arm64 (gitignored: a build artifact). Built
      # once from the crate's vendored source and cached on the script.
      - id: opus
        uses: actions/cache@v4
        with:
          path: third_party/opus-android-arm64
          key: opus-android-arm64-audiopus_sys-0.1.8-${{ hashFiles('scripts/opus-prepare-android.sh') }}

      - if: steps.opus.outputs.cache-hit != 'true'
        name: Build libopus.a (android/arm64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/opus-prepare-android.sh

      # cargokit compiles mosh-core into the plugin's Gradle build dir
      # (build/<plugin>/build), which the cargo cache above does not see.
      - uses: actions/cache@v4
        with:
          path: build/mosh_core/build
          key: cargokit-android-debug-${{ hashFiles('mosh-core/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargokit-android-debug-

      # --target-platform is REQUIRED, not an optimisation: jniLibs only
      # carries an arm64-v8a libmoss.so, so a default all-ABI build would
      # emit x86_64/armeabi APK slices whose dlopen("libmoss.so") fails at
      # runtime with no build-time error.
      - name: Build APK (debug, arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mosh-debug-arm64-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # The darwin compile of mosh-core (keychain, coreaudio, unix cfg paths)
  # and its runtime behaviour under dlopen of the real universal dylib.
  # fmt is OS-independent and stays gated on the windows job.
  rust-core-macos:
    name: Rust core on macOS (clippy + test)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          flutter: 'false'
          rust-cache-key: macos

      # Seconds, and the only check the iOS podspec gets before iOS CI.
      - name: Podspec syntax (both pods)
        run: |
          ruby -c rust_builder/macos/mosh_core.podspec
          ruby -c rust_builder/ios/mosh_core.podspec

      # Strict lint gate (ADR 0015): warnings fail the job.
      - name: Clippy check
        run: cargo clippy --manifest-path mosh-core/Cargo.toml --all-targets -- -D warnings

      # Match the Windows test network while loading the real universal dylib.
      - name: Cargo test
        run: node scripts/moss-test.mjs

  # Proves main still packages into the setup .exe users install. The same
  # reusable workflow builds the artifact a release publishes.
  windows-installer:
    uses: ./.github/workflows/build-windows.yml
    with:
      parallel-codegen: true

  # Same proof for the macOS DMG. On PRs, builds the fast host arm64 slice;
  # on main branch pushes or release tags, builds the full universal binary.
  macos-dmg:
    uses: ./.github/workflows/build-macos.yml
    with:
      universal: ${{ github.event_name != 'pull_request' }}
      parallel-codegen: true
    secrets: inherit
