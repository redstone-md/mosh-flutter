name: Windows network diagnostics

on:
  workflow_dispatch:
    inputs:
      announcement_compare:
        description: Compare uncached and memoized announcement verification
        type: boolean
        default: false
      interface_compare:
        description: Compare original and batched Moss interface operations
        type: boolean
        default: false
      interface_profile:
        description: Attribute Windows interface enumeration using unchanged pinned Moss
        type: boolean
        default: false
      stack_control:
        description: Validate caller export on a twelve-second busy owned process
        type: boolean
        default: false
      package_stack_export:
        description: Test and package reprocessing of the existing owner trace without a new recording
        type: boolean
        default: false
      profile_windows:
        description: Profile the exact configured release with a disposable full-application fixture
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/network-diagnostics.yml'
      - 'scripts/network-diagnostics/**'

permissions:
  contents: read
  actions: read

jobs:
  announcement-compare:
    if: github.event_name == 'workflow_dispatch' && inputs.announcement_compare
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: moss/go.sum
      - name: Build both immutable optimized revisions before measuring
        shell: bash
        working-directory: moss
        run: |
          mkdir -p ../build/announcement-profile
          git fetch origin fix/peer-claim-verification
          git checkout 82eb8b63453f835f34c4cc2abdad3faf11301aca
          cp internal/mesh/announcement_verification_bench_test.go ../build/announcement-profile/
          cp internal/mesh/announcement_verification_golden_test.go ../build/announcement-profile/
          go test -c -trimpath -o ../build/announcement-profile/after.exe ./internal/mesh
          git checkout 3361fc8
          cp ../build/announcement-profile/*_test.go internal/mesh/
          go test -c -trimpath -o ../build/announcement-profile/before.exe ./internal/mesh
          go version > ../build/announcement-profile/toolchain.txt
      - name: Compare twenty alternating pairs on the same host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | ConvertTo-Json | Set-Content build/announcement-profile/host.json
          python scripts/perf/compare_announcements.py build/announcement-profile
          if ($LASTEXITCODE -ne 0) { throw 'Announcement comparison failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-announcement-comparison
          path: |
            build/announcement-profile/*.json
            build/announcement-profile/*.txt
          retention-days: 7

  stack-control:
    if: github.event_name == 'workflow_dispatch' && (inputs.stack_control || inputs.package_stack_export)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-profile-app
        if: inputs.package_stack_export
        with:
          run-id: '40118006925'
          installer-sha: 3548089b54f521f70bcd3e0cea999a21ca6d1eb65c84f51e40c55c6e1edcc5c8
          runtime-commit: 54135ec0532522ab6dc771371ad8e1e3f0796b22
      - name: Check selected-PID stack parsing and real CPU export
        shell: powershell
        run: |
          python -m unittest discover -s scripts/perf -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Stack tests failed' }
          scripts/perf/Test-StackPaths.ps1
          scripts/perf/Test-StackExport.ps1
      - name: Package the verified exporter and original native symbols
        if: inputs.package_stack_export
        shell: powershell
        run: scripts/perf/Package-StackExport.ps1
      - name: Reprocess an existing trace from the exact installed release
        if: inputs.package_stack_export
        shell: powershell
        run: scripts/perf/Test-ExistingCpu.ps1
      - uses: actions/upload-artifact@v4
        if: inputs.package_stack_export
        with:
          name: windows-existing-cpu-export
          path: |
            build/mosh-existing-cpu-export.zip
            build/mosh-existing-cpu-export.zip.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-stack-control
          path: build/stack-control/*.json
          if-no-files-found: error
          retention-days: 7

  release-idle-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          moss: none
      - uses: ./.github/actions/install-profile-app
        with:
          run-id: '40133081747'
          installer-sha: 96579efd8773718af731647a0d797b3bfff7cf3d99d4317bf066a1cbbcae37dc
          runtime-commit: aa17f31ef0e5e75fa81b02fe72e9d82f9a1a6d5a
      - name: Validate and compile the measurement client
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts/perf -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          python -m unittest discover -s scripts/perf -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Stack export tests failed' }
          dart compile exe scripts/perf/idle_api.dart -o scripts/perf/idle-api.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bridge client compilation failed' }
          scripts/perf/idle-api.exe --validate
          Add-Type -Path scripts/perf/ProfileAccessibility.cs -ReferencedAssemblies Accessibility
      - name: Create the real saved-chat fixture and profile the shipping GUI
        shell: powershell
        env:
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/profile | Out-Null
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | ConvertTo-Json | Set-Content build/profile/hardware.json
          python scripts/perf/windows_idle.py "$env:IDLE_APP" build/profile 100
          if ($LASTEXITCODE -ne 0) { throw 'Release GUI profiling failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-current-idle-profile
          path: build/profile/*.json
          if-no-files-found: error
          retention-days: 7

  diagnostics:
    if: github.event_name != 'workflow_dispatch' || (!inputs.stack_control && !inputs.package_stack_export)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the built-in network event schema
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/network-diagnostics | Out-Null
          $provider = Get-WinEvent -ListProvider Microsoft-Windows-Kernel-Network
          $provider.Events | ForEach-Object {
            [pscustomobject]@{id=$_.Id; opcode=$_.Opcode.Name; task=$_.Task.Name; template=$_.Template}
          } | ConvertTo-Json -Depth 6 | Set-Content build/network-diagnostics/provider-schema.json
      - name: Verify real process-attributed UDP capture
        shell: powershell
        run: scripts/network-diagnostics/Test-NetworkDiagnostics.ps1
      - name: Verify Moss recorder process lifecycle
        shell: powershell
        run: scripts/network-diagnostics/Test-MossRecording.ps1
      - name: Verify Moss report timing and archive
        shell: powershell
        run: scripts/network-diagnostics/Test-MossRecordingReport.ps1
      - name: Verify real CPU module and instruction attribution
        shell: powershell
        run: |
          scripts/network-diagnostics/Test-CpuEvents.ps1
          scripts/network-diagnostics/Test-MoshCpu.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-network-diagnostics-schema
          path: build/network-diagnostics/provider-schema.json
          retention-days: 7
      - name: Package the Windows collector
        shell: powershell
        run: |
          $files = Get-ChildItem scripts/network-diagnostics -File | Where-Object { $_.Name -notlike 'Test-*' }
          Compress-Archive -Path $files.FullName -DestinationPath build/mosh-network-diagnostics.zip
          $hash = (Get-FileHash build/mosh-network-diagnostics.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  mosh-network-diagnostics.zip" | Set-Content build/mosh-network-diagnostics.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-network-diagnostics
          path: |
            build/mosh-network-diagnostics.zip
            build/mosh-network-diagnostics.zip.sha256
          retention-days: 14

  interface-profile:
    if: github.event_name == 'workflow_dispatch' && (inputs.interface_profile || inputs.interface_compare)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: moss/go.sum
      - name: Build probe against unchanged pinned Moss
        shell: bash
        working-directory: scripts/perf/moss-profile
        run: |
          go mod init github.com/redstone-md/moss/diagnostics
          go mod edit -go=1.25.0 -require=github.com/redstone-md/moss@v0.0.0 -replace=github.com/redstone-md/moss=../../../moss
          go mod tidy
          go build -trimpath -o moss-profile.exe .
          git -C ../../../moss diff --exit-code
          mkdir -p ../../../build/interface-profile
      - name: Profile isolated enumeration and LAN scenarios
        if: inputs.interface_profile
        shell: bash
        run: |
          for scenario in interfaces addresses mesh-query idle-no-lan idle-lan; do
            prefix="build/interface-profile/$scenario"
            scripts/perf/moss-profile/moss-profile.exe -scenario "$scenario" -duration 15s -output "$prefix"
            go tool pprof -top -cum "$prefix.pprof" > "$prefix.top.txt"
            go tool pprof -traces "$prefix.pprof" > "$prefix.traces.txt"
          done
          git -C moss diff --exit-code
      - name: Build both immutable revisions
        if: inputs.interface_compare
        shell: bash
        working-directory: scripts/perf/moss-profile
        run: |
          test "$(git -C ../../../moss rev-parse HEAD)" = eb79f38e4ef9380b5b398d161a42c65c17b1e4c4
          mv moss-profile.exe ../../../build/interface-profile/before.exe
          git -C ../../../moss fetch origin fix/peer-claim-verification
          git -C ../../../moss checkout 3526e05205ec5c315eaafa5fed879ba5f7faa1bb
          go build -trimpath -o ../../../build/interface-profile/after.exe .
      - name: Verify the Windows inventory against native API results
        if: inputs.interface_compare
        shell: bash
        working-directory: moss
        run: |
          go test ./internal/mesh -run 'TestWindowsInventory|TestLANBeaconReads|TestInterfaceSnapshot|TestAdvertisedFastPaths' -count=1 -timeout 120s -coverprofile ../build/interface-profile/coverage-windows.out
          go tool cover -func ../build/interface-profile/coverage-windows.out > ../build/interface-profile/coverage-windows.txt
      - name: Record host and compare without competing build work
        if: inputs.interface_compare
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @{ processor = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors); os = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber); image = $env:ImageVersion } | ConvertTo-Json -Depth 5 | Set-Content build/interface-profile/host.json
          python scripts/perf/compare_interfaces.py build/interface-profile
          if ($LASTEXITCODE -ne 0) { throw 'Matched comparison failed' }
      - name: Reprofile the same query component
        if: inputs.interface_compare
        shell: bash
        run: |
          for variant in before after; do
            prefix="build/interface-profile/$variant-query"
            "build/interface-profile/$variant.exe" -scenario mesh-query -duration 15s -output "$prefix"
            go tool pprof -top -cum "$prefix.pprof" > "$prefix.top.txt"
            go tool pprof -traces "$prefix.pprof" > "$prefix.traces.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-interface-profile
          path: |
            build/interface-profile/*.json
            build/interface-profile/*.txt
            build/interface-profile/*.pprof
            build/interface-profile/*.out
          if-no-files-found: error
          retention-days: 7
