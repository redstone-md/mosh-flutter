name: Windows network diagnostics

on:
  workflow_dispatch:
    inputs:
      measure_native:
        description: Include the headless baseline (disable when debugging GUI automation)
        type: boolean
        default: true
      owner_toolkit:
        description: Validate and package the installed-app CPU collector
        type: boolean
        default: false
      profile_cpu:
        description: Sample CPU with the pinned Microsoft PerfView tool
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/network-diagnostics.yml'
      - 'scripts/network-diagnostics/**'

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the built-in network event schema
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/network-diagnostics | Out-Null
          $provider = Get-WinEvent -ListProvider Microsoft-Windows-Kernel-Network
          $provider.Events | ForEach-Object {
            [pscustomobject]@{id=$_.Id; opcode=$_.Opcode.Name; task=$_.Task.Name; template=$_.Template}
          } | ConvertTo-Json -Depth 6 | Set-Content build/network-diagnostics/provider-schema.json
      - name: Verify real process-attributed UDP capture
        shell: powershell
        run: scripts/network-diagnostics/Test-NetworkDiagnostics.ps1
      - name: Verify Moss recorder process lifecycle
        shell: powershell
        run: scripts/network-diagnostics/Test-MossRecording.ps1
      - name: Verify Moss report timing and archive
        shell: powershell
        run: scripts/network-diagnostics/Test-MossRecordingReport.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-network-diagnostics-schema
          path: build/network-diagnostics/provider-schema.json
          retention-days: 7
      - name: Package the Windows collector
        shell: powershell
        run: |
          $files = Get-ChildItem scripts/network-diagnostics -File | Where-Object { $_.Name -notlike 'Test-*' }
          Compress-Archive -Path $files.FullName -DestinationPath build/mosh-network-diagnostics.zip
          $hash = (Get-FileHash build/mosh-network-diagnostics.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  mosh-network-diagnostics.zip" | Set-Content build/mosh-network-diagnostics.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-network-diagnostics
          path: |
            build/mosh-network-diagnostics.zip
            build/mosh-network-diagnostics.zip.sha256
          retention-days: 14

  release-idle-profile:
    if: github.event_name == 'workflow_dispatch' && !inputs.owner_toolkit
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: 'false'
          moss: none
      - uses: ./.github/actions/install-profile-app
      - name: Compile API client and validate measurement scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts/perf -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          dart compile exe scripts/perf/idle_api.dart -o scripts/perf/idle-api.exe
          if ($LASTEXITCODE -ne 0) { throw 'API client compilation failed' }
          scripts/perf/idle-api.exe --validate
          Add-Type -Path scripts/perf/ProfileAccessibility.cs -ReferencedAssemblies Accessibility
          python -m py_compile scripts/perf/windows_idle.py
          if ($LASTEXITCODE -ne 0) { throw 'Driver validation failed' }
      - name: Validate sampled CPU attribution
        if: inputs.profile_cpu
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:RUNNER_TEMP 'PerfView.exe'
          Invoke-WebRequest https://github.com/microsoft/perfview/releases/download/v4.0.0/PerfView.exe -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne '270e2ba419b0b2d93c4b15b0851f257edf655c92fe0ad95add3d0b5f6d6aad48') { throw 'Profiler checksum mismatch' }
          python scripts/perf/cpu_profile.py "$tool" build/profile
          if ($LASTEXITCODE -ne 0) { throw 'Sampled CPU control failed' }
          "IDLE_CPU_TOOL=$tool" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Measure the real release DLL through FFI
        shell: powershell
        env:
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
          IDLE_MEASURE_NATIVE: ${{ inputs.measure_native }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/profile | Out-Null
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | ConvertTo-Json | Set-Content build/profile/hardware.json
          python scripts/perf/windows_idle.py "$env:IDLE_APP" build/profile native
          if ($LASTEXITCODE -ne 0) { throw 'Real release profiling failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-idle-native-profile
          path: build/profile/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Measure the full desktop application
        shell: powershell
        env:
          MOSH_PLUS_ISSUER_KEY: ${{ vars.MOSH_PLUS_ISSUER_KEY }}
        run: |
          python scripts/perf/windows_idle.py "$env:IDLE_APP" build/profile gui
          if ($LASTEXITCODE -ne 0) { throw 'GUI profiling failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-idle-aggregate-profile
          path: build/profile/*.json
          if-no-files-found: ignore
          retention-days: 7

  owner-cpu-toolkit:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_toolkit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-profile-app
      - name: Validate real CPU sampling, instruction attribution and Go symbols
        shell: powershell
        run: scripts/network-diagnostics/Test-MoshCpu.ps1 -MossLibrary "$env:IDLE_APP/moss.dll"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-toolkit-control
          path: ${{ runner.temp }}/cpu-control-*/*.json
          if-no-files-found: ignore
          retention-days: 7
