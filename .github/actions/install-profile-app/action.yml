name: Install the verified idle-profile binary
description: Use the already built public installer without recompiling product code.
inputs:
  run-id:
    description: Workflow run containing the immutable installer and native symbols.
    default: '39861533400'
  installer-sha:
    description: Expected installer SHA-256.
    default: fac58b500aa947bf879b3af6c5601e9d12f43996cf4682474a22f37930b732fb
  runtime-commit:
    description: Expected source commit in both shipping manifests.
    default: cd6df31b352a4df40c33c88009d52b866c5451d7
runs:
  using: composite
  steps:
    - shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
        PROFILE_RUN: ${{ inputs.run-id }}
        PROFILE_INSTALLER_SHA: ${{ inputs.installer-sha }}
        PROFILE_RUNTIME_COMMIT: ${{ inputs.runtime-commit }}
      run: |
        $ErrorActionPreference = 'Stop'
        gh run download $env:PROFILE_RUN --repo redstone-md/mosh-flutter --name mosh-windows-setup --dir build/source
        if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
        gh run download $env:PROFILE_RUN --repo redstone-md/mosh-flutter --name mosh-windows-native-symbols --dir build/native-symbols
        if ($LASTEXITCODE -ne 0) { throw 'Matching symbols download failed' }
        Remove-Item Env:GH_TOKEN
        $exe = @(Get-ChildItem build/source -Recurse -Filter *.exe)
        if ($exe.Count -ne 1) { throw 'Expected one installer' }
        $hash = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne $env:PROFILE_INSTALLER_SHA) { throw 'Installer hash mismatch' }
        $manifestFile = @(Get-ChildItem build/source -Recurse -Filter plus-build.json)[0].FullName
        $manifest = Get-Content $manifestFile -Raw | ConvertFrom-Json
        if ($manifest.commit -ne $env:PROFILE_RUNTIME_COMMIT -or -not $manifest.purchases_configured) { throw 'Source/PLUS manifest mismatch' }
        $installPath = Join-Path $env:RUNNER_TEMP 'mosh-idle-app'
        $setup = Start-Process $exe[0].FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installPath`"", '/TASKS=') -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
        $symbols = Get-Content build/native-symbols/manifest.json -Raw | ConvertFrom-Json
        if ($symbols.commit -ne $manifest.commit) { throw 'Symbol source mismatch' }
        foreach ($binary in $symbols.binaries) {
          if ((Get-FileHash "$installPath/$($binary.name)").Hash.ToLowerInvariant() -ne $binary.sha256) { throw 'Shipping binary mismatch' }
        }
        if ((Get-FileHash build/native-symbols/mosh_core.pdb).Hash.ToLowerInvariant() -ne $symbols.pdb_sha256) { throw 'PDB checksum mismatch' }
        Copy-Item build/native-symbols/mosh_core.pdb $installPath
        "_NT_SYMBOL_PATH=$installPath;srv*$env:RUNNER_TEMP/symbol-cache*https://msdl.microsoft.com/download/symbols" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "IDLE_APP=$installPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "IDLE_RUNTIME_SOURCE=$($manifest.commit)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
