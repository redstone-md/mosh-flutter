name: Setup toolchain
description: >-
  Go + Rust + Flutter and the moss shared library. One home for the toolchain
  pins so a job never drifts from the others. Caches are restored everywhere
  and saved only from main: the repository has 10 GB of cache, and entries a
  pull request saves are visible to no other ref, so they only evict main's.

inputs:
  flutter:
    description: Install Flutter and run `flutter pub get`.
    default: 'true'
  rust:
    description: Install the pinned Rust toolchain and restore the cargo cache.
    default: 'true'
  moss:
    description: Provide the desktop moss shared library. Gradle builds Android's.
    default: 'true'
  go:
    description: Install Go even without a moss library, for jobs that inspect the module graph or build Android's library.
    default: 'false'
  rust-cache-key:
    description: >-
      Cargo cache namespace. Jobs building the same targets on the same OS
      share one cache instead of each saving their own copy. `none` skips the
      cache, for jobs that finish within the critical path without it.
    default: desktop
  rust-cache-save:
    description: >-
      Save the Cargo cache from main. For the one job of a namespace that
      builds everything the others restore: the first job to finish saves the
      key, and a job that builds less leaves the rest compiling every run.
    default: 'false'

runs:
  using: composite
  steps:
    # Runner networking drops crates.io and npm requests now and then
    # ("Error in the HTTP2 framing layer", DNS failures, ETIMEDOUT). Retry
    # longer, and fetch crates over HTTP/1.1, which avoids the HTTP/2 errors.
    - name: Network retries
      shell: bash
      run: |
        {
          echo CARGO_NET_RETRY=10
          echo CARGO_HTTP_MULTIPLEXING=false
          echo npm_config_fetch_retries=5
          echo npm_config_fetch_retry_mintimeout=20000
        } >> "$GITHUB_ENV"

    - if: inputs.rust == 'true'
      name: Prepare pinned OpenMLS sources
      shell: bash
      run: node scripts/openmls-prepare.mjs

    # The moss library is a cgo build of the submodule: minutes per job, and
    # byte-identical for the same sources and Go version. Cache it on the
    # sources so only a submodule bump rebuilds it: the Go files, the module
    # files and the embedded country database, the inputs Gradle names for
    # the Android library.
    - if: inputs.moss == 'true'
      id: moss-desktop
      uses: actions/cache/restore@v4
      with:
        path: moss-runtime
        key: moss-desktop-${{ runner.os }}-go1.25.9-${{ hashFiles('moss/**/*.go', 'moss/**/*.mmdb.gz', 'moss/go.mod', 'moss/go.sum', 'scripts/moss-prepare.mjs') }}

    # moss-prepare pins GOTOOLCHAIN=go1.25.9; installing that exact version
    # makes the toolchain directive a no-op (no on-the-fly download). No Go
    # cache: setup-go would save it from pull requests too, and the moss
    # library cache above skips the Go build in every desktop job. Only the
    # moss builds and the license job run Go, so a desktop job with its
    # library restored installs none: 20 seconds on Windows.
    - if: inputs.go == 'true' || (inputs.moss == 'true' && steps.moss-desktop.outputs.cache-hit != 'true')
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.9'
        cache: false

    # rust-toolchain.toml is the single source of truth for the channel and
    # components; `rustup show` installs whatever it names.
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show

    - if: inputs.rust == 'true' && inputs.rust-cache-key != 'none'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: mosh-core
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.rust-cache-save == 'true' }}

    # The camera helper's JPEG decoder assembles its x86 SIMD with nasm;
    # scripts/native-media-build.mjs refuses to build without it in CI.
    # Chocolatey leaves it off PATH. Linux gets it from native-media-linux.
    - if: inputs.rust == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        choco install nasm -y --no-progress
        echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"

    # Pinned in .fvmrc, not `channel: stable`: a runner picking up a newer
    # Flutter than the one the release was built with is a drift nobody asked
    # for. F-Droid's build reads the same file (fdroid/build.sh).
    # The SDK is not cached: installing it takes 50-95 s, restoring it hardly
    # less, and it took 1.6-1.8 GB of cache per OS.
    - if: inputs.flutter == 'true'
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        channel: stable

    # `flutter build windows` runs MSBuild with one project at a time and cl
    # with one file at a time. With these the Rust core and the call engine
    # build side by side and the C++ of the plugins and Sentry uses every
    # core: the release app builds in 573 to 770 s against 884 to 933. Set
    # after the cargo cache step, whose key takes in every CMAKE* variable.
    # The option starts with a dash: Git Bash rewrites a value that starts
    # with a slash into a path under its own root when it starts a Windows
    # program, and cl then finds no compiler option in it.
    - if: inputs.flutter == 'true' && runner.os == 'Windows'
      name: Parallel MSBuild projects and C++ files
      shell: bash
      run: |
        {
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$NUMBER_OF_PROCESSORS"
          echo CL=-MP
        } >> "$GITHUB_ENV"

    # Windows pub-cache compression took 17 minutes after installer upload.
    - if: inputs.flutter == 'true' && runner.os != 'Windows'
      id: pub-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}

    - if: inputs.flutter == 'true'
      shell: bash
      run: flutter pub get

    - if: steps.pub-cache.outcome == 'success' && steps.pub-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.pub-cache.outputs.cache-primary-key }}

    - if: inputs.moss == 'true' && steps.moss-desktop.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/moss-prepare.mjs

    - if: inputs.moss == 'true' && steps.moss-desktop.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: moss-runtime
        key: ${{ steps.moss-desktop.outputs.cache-primary-key }}
