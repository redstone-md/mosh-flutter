name: Setup toolchain
description: >-
  Go + Rust + Flutter and the moss shared library. One home for the toolchain
  pins so a job never drifts from the others. Caches are restored everywhere
  and saved only from main: the repository has 10 GB of cache, and entries a
  pull request saves are visible to no other ref, so they only evict main's.

inputs:
  flutter:
    description: Install Flutter and run `flutter pub get`.
    default: 'true'
  rust:
    description: Install the pinned Rust toolchain and restore the cargo cache.
    default: 'true'
  moss:
    description: Which moss shared library to provide -- desktop, android or none.
    default: desktop
  go:
    description: Install Go even without a moss library, for jobs that inspect the module graph.
    default: 'false'
  rust-cache-key:
    description: >-
      Cargo cache namespace. Jobs building the same targets on the same OS
      share one cache instead of each saving their own copy. `none` skips the
      cache, for jobs that finish within the critical path without it.
    default: desktop

runs:
  using: composite
  steps:
    # Runner networking drops crates.io and npm requests now and then
    # ("Error in the HTTP2 framing layer", DNS failures, ETIMEDOUT). Retry
    # longer, and fetch crates over HTTP/1.1, which avoids the HTTP/2 errors.
    - name: Network retries
      shell: bash
      run: |
        {
          echo CARGO_NET_RETRY=10
          echo CARGO_HTTP_MULTIPLEXING=false
          echo npm_config_fetch_retries=5
          echo npm_config_fetch_retry_mintimeout=20000
        } >> "$GITHUB_ENV"

    - if: inputs.rust == 'true'
      name: Prepare pinned OpenMLS sources
      shell: bash
      run: node scripts/openmls-prepare.mjs

    # moss-prepare pins GOTOOLCHAIN=go1.25.9; installing that exact version
    # makes the toolchain directive a no-op (no on-the-fly download). No Go
    # cache: setup-go would save it from pull requests too, and the moss
    # library cache below skips the Go build in every job but the license one.
    - if: inputs.moss != 'none' || inputs.go == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.9'
        cache: false

    # rust-toolchain.toml is the single source of truth for the channel and
    # components; `rustup show` installs whatever it names.
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show

    # audiopus_sys builds its vendored libopus through autotools; the
    # macOS runner image ships neither autoreconf nor libtool.
    # The vendored Opus build on Windows uses the available CMake.
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install autoconf automake libtool

    - if: inputs.rust == 'true' && inputs.rust-cache-key != 'none'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: mosh-core
        shared-key: ${{ inputs.rust-cache-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # Pinned, not `channel: stable`: a runner picking up a newer Flutter
    # than the one the release was built with is a drift nobody asked for.
    # The SDK is not cached: installing it takes 50-95 s, restoring it hardly
    # less, and it took 1.6-1.8 GB of cache per OS.
    - if: inputs.flutter == 'true'
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.44.8
        channel: stable

    # Windows pub-cache compression took 17 minutes after installer upload.
    - if: inputs.flutter == 'true' && runner.os != 'Windows'
      id: pub-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}

    - if: inputs.flutter == 'true'
      shell: bash
      run: flutter pub get

    - if: steps.pub-cache.outcome == 'success' && steps.pub-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.pub-cache.outputs.cache-primary-key }}

    # The moss library is a cgo build of the submodule: minutes per job, and
    # byte-identical for the same sources and Go version. Cache it on the
    # sources so only a submodule bump rebuilds it.
    - if: inputs.moss == 'desktop'
      id: moss-desktop
      uses: actions/cache/restore@v4
      with:
        path: moss-runtime
        key: moss-desktop-${{ runner.os }}-go1.25.9-${{ hashFiles('moss/**/*.go', 'moss/go.sum', 'scripts/moss-prepare.mjs') }}

    - if: inputs.moss == 'desktop' && steps.moss-desktop.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/moss-prepare.mjs

    - if: inputs.moss == 'desktop' && steps.moss-desktop.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: moss-runtime
        key: ${{ steps.moss-desktop.outputs.cache-primary-key }}

    - if: inputs.moss == 'android'
      id: moss-android
      uses: actions/cache/restore@v4
      with:
        path: android/app/src/main/jniLibs/arm64-v8a/libmoss.so
        key: moss-android-arm64-go1.25.9-${{ hashFiles('moss/**/*.go', 'moss/go.sum', 'scripts/moss-prepare-android.mjs') }}

    # The runner image exposes its NDK as ANDROID_NDK_LATEST_HOME; the script
    # reads ANDROID_NDK_HOME. Exported in the shell on purpose: the `env`
    # context does not see runner-image variables.
    - if: inputs.moss == 'android' && steps.moss-android.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        echo "Using NDK: $ANDROID_NDK_HOME"
        node scripts/moss-prepare-android.mjs

    - if: inputs.moss == 'android' && steps.moss-android.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: android/app/src/main/jniLibs/arm64-v8a/libmoss.so
        key: ${{ steps.moss-android.outputs.cache-primary-key }}
