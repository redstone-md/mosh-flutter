name: Prepare Android build
description: Pinned toolchains and shared arm64 Moss, Opus and Cargokit preparation.
inputs:
  build-mode:
    description: Native build cache namespace (debug or release).
    default: debug
outputs:
  cargo-cache-key:
    description: Resolved native compiler cache key.
    value: ${{ steps.cargokit.outputs.cache-primary-key }}
  cargo-cache-hit:
    description: Whether that exact native compiler cache already exists.
    value: ${{ steps.cargokit.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # Gradle needs a JDK; Flutter's Android toolchain expects 17+.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle

    # Dart hooks retain HOME but deliberately filter Cargo environment variables.
    # Target-scoped Cargo config reaches the hook without patching its package.
    - name: Configure 16 KiB native hook linking
      shell: bash
      run: |
        mkdir -p "$HOME/.cargo"
        config="$HOME/.cargo/config.toml"
        if [ -f "$config" ] && grep -q '^\[target\.aarch64-linux-android\]' "$config"; then
          echo '::error::Existing Android Cargo configuration needs review'
          exit 1
        fi
        cat scripts/support/android-cargo-config.toml >> "$config"

    - uses: ./.github/actions/setup
      with:
        moss: android
        rust-cache-key: android

    - name: Android native hook preparation tests
      shell: bash
      run: node --test scripts/android-native-hooks-prepare.test.mjs

    # irondash's Android hook has its own rust-toolchain.toml in the Pub
    # cache. Prepare its pinned compiler and targets before Gradle, with
    # bounded retries, instead of downloading them inside the asset hook.
    - name: Prepare Android native hook Rust toolchain
      shell: bash
      run: node scripts/android-native-hooks-prepare.mjs

    # Cargokit builds libmosh_core.so for the device ABI; the target has to
    # exist before Gradle invokes it. build.gradle.kts pins arm64-v8a.
    - name: Add Rust android target
      shell: bash
      run: rustup target add aarch64-linux-android

    - name: Verify Android JVM bootstrap
      shell: bash
      run: |
        node scripts/android-context-check.mjs
        node --test scripts/native-source-check.test.mjs

    # Cache only verified native products, not Chromium's 20+ GiB source tree.
    - uses: actions/cache@v4
      with:
        path: .dart_tool/android-media/webrtc
        key: android-webrtc-${{ hashFiles('third_party/webrtc-android-patches/**', 'third_party/ringrtc-patches/source.json', 'scripts/android-webrtc-build.mjs', 'scripts/support/native-source-check.mjs') }}

    - name: Make room for the pinned WebRTC source build
      shell: bash
      run: |
        # These are unused preinstalled tools on the disposable Android runner.
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

    # audiopus_sys links a prebuilt arm64 libopus.a from
    # third_party/opus-android-arm64 (gitignored: a build artifact). Built
    # once from the crate's vendored source and cached on the script.
    - id: opus
      uses: actions/cache@v4
      with:
        path: third_party/opus-android-arm64
        key: opus-android-arm64-audiopus_sys-0.1.8-${{ hashFiles('scripts/opus-prepare-android.sh') }}

    - if: steps.opus.outputs.cache-hit != 'true'
      name: Build libopus.a (android/arm64)
      shell: bash
      run: |
        export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        bash scripts/opus-prepare-android.sh

    # cargokit compiles mosh-core into the plugin's Gradle build dir
    # (build/<plugin>/build), which the cargo cache above does not see.
    - id: cargokit
      uses: actions/cache/restore@v4
      with:
        path: build/mosh_core/build
        key: cargokit-android-${{ inputs.build-mode }}-${{ hashFiles('mosh-core/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: cargokit-android-${{ inputs.build-mode }}-

