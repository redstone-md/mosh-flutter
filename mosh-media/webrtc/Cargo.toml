[package]
name = "mosh-webrtc-media"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# The call engine on Google's libwebrtc through LiveKit's bindings, every
# packet carried by mosh-core over Moss through the mosh_media_* C ABI;
# scripts/native-media-build.mjs packages it.
[lib]
name = "mosh_native_media"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
futures = "0.3"
libwebrtc = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
# The version webrtc-sys builds with; see build.rs.
webrtc-sys-build = "=0.3.21"

[patch.crates-io]
libwebrtc = { path = "../../third_party/libwebrtc" }
webrtc-sys = { path = "../../third_party/webrtc-sys" }

[profile.dev]
debug = 0
