# Licenses of the Rust code Mosh ships: mosh-core and the media crates that
# go into store builds. Checked in CI with
#   cargo deny --manifest-path <crate>/Cargo.toml --config deny.toml check licenses
# Every license here is compatible with GPL-3.0 and with the app stores.
# docs/licenses.md records the audit behind this list.

[graph]
all-features = true
exclude-dev = true

[licenses]
confidence-threshold = 0.9
# One list serves several crates; not every crate uses every license.
unused-allowed-license = "allow"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "IJG",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft: hpke-rs and its backends, whose source is public.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "zlib-acknowledgement",
]
# Our own crates are GPL-3.0-or-later with the store exception in LICENSE.
private = { ignore = true }

