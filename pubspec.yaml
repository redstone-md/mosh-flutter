name: mosh
description: "Mosh - desktop-first decentralized E2EE messenger, Flutter shell"
publish_to: "none"
version: 0.9.3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  flutter_riverpod: ^3.0.0
  hooks_riverpod: ^3.0.0
  go_router: ^17.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  mosh_core:
    path: rust_builder
  app_links: ^7.2.1
  win32_registry: ^3.0.3
  flutter_secure_storage: ^10.3.1
  # M-5 (ADR 0010): direct dep so Dart can resolve the platform's
  # app-private support directory (getApplicationSupportDirectory) and
  # bridge it to Rust via set_app_data_dir before construct_runtime runs.
  # Already a transitive dep via flutter_secure_storage; pinning the
  # resolved lock version (2.1.6) keeps the lock untouched on `pub get`.
  path_provider: ^2.1.6
  # Slice-3 attachment-send: native file picker for the channel/group
  # Composer's AttachmentPicker (paperclip) button. Returns a PlatformFile
  # whose bytes are read + base64-encoded for gateway.sendChannelAttachment /
  # sendGroupAttachment. Desktop + mobile + web (web uses `bytes`, not path).
  file_picker: ^12.0.0-beta.7
  # MIME inference for the picked file (file_picker exposes no MIME, unlike
  # the browser `File.type`). Promoted to a direct dep so pub get cannot drop
  # it; pinned to the already-resolved transitive lock version (2.0.0).
  mime: ^2.0.0
  # Slice-3 attachment thumbnails: a 320px JPEG preview for image picks
  # (1-в-1 with React createThumbnail / imageThumbnail). Pure-Dart decoder +
  # encoder (no native plugin), so it works on desktop + mobile + web.
  # Video thumbnails are NOT covered here (React videoThumbnail needs a
  # canvas offscreen render; that is a later slice -- needs video_player +
  # RepaintBoundary capture).
  image: ^4.5.3
  # Slice-3 voice composer: microphone capture for the VoiceComposer
  # widget (1-в-1 port of React voice/VoiceComposer.tsx). AudioRecorder
  # records to a file (start/stop return a path) + onAmplitudeChanged
  # drives the waveform preview. Desktop + mobile + web platform impls.
  record: ^7.1.1
  # Slice-3 media viewer: video + audio playback for the MediaViewer
  # fullscreen dialog (1-в-1 port of React MediaViewer.tsx <video/
  # <audio controls autoPlay>). media_kit is cross-platform (desktop +
  # mobile + web), so one package covers both branches; media_kit_video
  # renders the video surface, media_kit_libs_video pulls the native
  # decoders per platform (windows/linux/macos/ios/android).
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # Voice-call real-runtime slice: AES-GCM frame seal/open for 1:1 calls
  # (1-в-1 port of React frame-crypto.ts). pure-Dart AesGcm with a
  # cryptography_flutter native backend (Android/iOS/macOS) and background
  # impl on Windows/Linux. One package covers desktop + mobile + web.
  cryptography: ^2.9.0
  # Native AES-GCM acceleration: FlutterAesGcm is up to 50x faster than the
  # pure-Dart impl on Android/iOS/macOS; BackgroundAesGcm handles large
  # inputs on Windows/Linux. Pure-Dart fallback works in `flutter test`
  # without initialization, so frame_crypto tests stay host-agnostic.
  cryptography_flutter: ^2.3.4
  flutter_local_notifications: ^22.2.0
  window_manager: ^0.5.2
  super_clipboard: ^0.10.0-dev.2
  desktop_drop: ^0.7.1
  url_launcher: ^6.3.2
  # Atomic #1 (external-open-attachment-on-Android, infra): maintained fork of
  # open_file that internally builds an ACTION_VIEW Intent with a FileProvider
  # content URI for app-private storage files -- the one thing url_launcher
  # cannot do on Android. Used by UrlLauncherAttachmentLauncher for
  # AttachmentExternalOpenIntent (PDFs/docs/archives, NOT viewable media).
  # Atomic #2 will wire it into the launcher; this atomic only adds the dep +
  # the FileProvider config it requires.
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  super_native_extensions: ^0.10.0-dev.2

flutter:
  generate: true
  uses-material-design: true

flutter_rust_bridge:
  rust_input: crate::api
  rust_root: mosh-core/
  dart_output: lib/src/rust
