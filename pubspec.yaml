name: mosh
description: "Mosh - desktop-first decentralized E2EE messenger, Flutter shell"
publish_to: "none"
version: 0.8.0-dev

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  flutter_riverpod: ^3.0.0
  hooks_riverpod: ^3.0.0
  go_router: ^17.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  mosh_core:
    path: rust_builder
  app_links: ^7.2.1
  win32_registry: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

flutter_rust_bridge:
  rust_input: crate::api
  rust_root: mosh-core/
  dart_output: lib/src/rust
