Categories:
  - Messaging
  - Voice & Video Chat
License: GPL-3.0-or-later
AuthorName: Redstone
SourceCode: https://github.com/redstone-md/mosh-flutter
IssueTracker: https://github.com/redstone-md/mosh-flutter/issues
Changelog: https://github.com/redstone-md/mosh-flutter/blob/HEAD/CHANGELOG.md

AutoName: Mosh

RepoType: git
Repo: https://github.com/redstone-md/mosh-flutter.git

Builds:
  - versionName: 0.29.1
    versionCode: 29001
    commit: v0.29.1
    timeout: 14400
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless build-essential golang-go nodejs
        protobuf-compiler cmake ninja-build pkg-config
      - update-java-alternatives -s java-1.21.0-openjdk-amd64
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
      - rustup@1.28.2
    rm:
      - ios
      - linux
      - macos
      - windows
      - moss/examples
      - moss/internal/geo/GeoLite2-Country.mmdb.gz
      - android/app/src/fcm
      - android/app/src/fcmTest
    prebuild:
      - flutterVersion=$(node -p 'JSON.parse(require("fs").readFileSync(".fvmrc","utf8")).flutter')
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH=$HOME/.cargo/bin:$PATH
      - sh $$rustup$$/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain
        none
      - rustup toolchain install
      - rustup target add aarch64-linux-android
      - cat scripts/support/android-cargo-config.toml >> $HOME/.cargo/config.toml
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - node scripts/android-native-hooks-prepare.mjs
    scandelete:
      - .pub-cache
    build:
      - export PATH=$HOME/.cargo/bin:$PATH
      - export PUB_CACHE=$(pwd)/.pub-cache
      - 
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64
        --split-debug-info=build/android-symbols --dart-define=MOSH_DISTRIBUTION_CHANNEL=fdroid
        --dart-define=MOSH_PLUS_NETWORK=solana-mainnet --dart-define=MOSH_PLUS_ISSUER_KEY=$plusIssuerKey
        --android-project-arg=moshUnsignedRelease=true
    ndk: r28c

MaintainerNotes: |-
  Calls link Google's libwebrtc statically. F-Droid does not build WebRTC
  (fdroid/admin#364), so Mosh publishes its own build to Maven Central as
  run.mosh:libwebrtc, the way Conversations publishes
  im.conversations.webrtc:webrtc-android. It is LiveKit's webrtc-sdk fork at the
  commit in third_party/libwebrtc-build/build.json, built without H.264 by the
  open scripts in .github/workflows/libwebrtc.yml; the build checks the
  archive against the SHA-256 in that file.
  .
  No anti-features apply. The F-Droid build sells no Mosh+ membership and never contacts the billing
  server; it shows a membership bought elsewhere, verified offline against the
  public key in the build step. Crash reports are off: the build has no Sentry
  DSN. Our own builds can be woken through Firebase Cloud Messaging; that
  code and its build live in android/app/src/fcm, which the recipe removes,
  and the F-Droid build never sets -PmoshFcm. Peers find each other through
  public BitTorrent trackers and DHT and public STUN servers, not a service
  run by the developers. The GeoIP database is only used by Moss builds with
  the geoip tag, which Mosh does not set.
  .
  Toolchains come the usual way: Rust through rustup, and Go 1.25.9, newer
  than Debian's, through Go's own toolchain download (GOTOOLCHAIN in
  scripts/moss-prepare-android.mjs), checked against sum.golang.org.
  .
  The fdroid workflow of the repository runs this recipe in the fdroidserver
  buildserver image on every release.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
