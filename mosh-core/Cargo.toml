[package]
name = "mosh-core"
version = "0.7.4"
description = "Tauri-free core adapters for Mosh (crypto, transport, persistence, runtimes)"
authors = ["Mosh contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
native-media-tests = []

[[bin]]
name = "mosh-camera-test-driver"
path = "tests/support/camera_test_driver.rs"
required-features = ["native-media-tests"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libloading = "0.9"
keyring = "4.0"
keyring-core = "1.0"
flutter_rust_bridge = "=2.12.0"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
openmls = { version = "0.8.1", path = "../third_party/openmls", features = ["openmls_rust_crypto"] }
url = '2'
aes-gcm = "0.10"
redb = "2"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
mime_guess = "2"
if-addrs = "0.15.0"
audiopus = { version = "0.2.0", features = ["encoder", "decoder"] }
cpal = "0.18.1"
ringbuf = "0.5.1"
# ADR 0035: panic capture only. No transport feature: events go to Dart,
# which scrubs and sends them.
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "debug-images", "panic"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

# flutter_rust_bridge's `frb` attribute macros emit `#[cfg(frb_expand)]`
# during expansion; register it as an expected cfg so the
# `unexpected_cfgs` lint stays quiet under the strict clippy gate
# (ADR 0015). No code is gated on this cfg — it is macro-internal.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Ship the smallest, fastest core: whole-program LTO and one codegen unit
# cost release-build minutes, never runtime. `panic` stays `unwind` because
# flutter_rust_bridge turns a Rust panic into a Dart exception.
#
# Line tables go to separate debug files (PDB on Windows, dSYM on macOS) that
# CI uploads to Sentry, so crashes symbolicate without shipping DWARF
# (ADR 0035). `strip` stays off: on MSVC any strip level suppresses the PDB,
# and the shipped DLL carries no symbols there anyway. Android packaging
# strips the .so itself; a Linux build keeps its DWARF in the .so (no Linux
# release ships).
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"
